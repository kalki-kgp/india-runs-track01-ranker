ai_usage_summary: |
  Used AI coding assistants for challenge understanding, architecture discussion,
  implementation support, debugging, documentation, and comparison against a
  pure-LLM baseline. The submitted ranking step is deterministic local Python:
  it performs no hosted LLM calls, no network calls, no GPU inference, and no
  model downloads during ranking.

methodology_summary: |
  Deterministic offline candidate ranker for the Senior AI Engineer JD. The
  system combines title relevance, career evidence for ranking/search/retrieval
  systems, skill-taxonomy fit, behavioral availability signals, experience,
  location, education, and explicit honeypot/keyword-stuffer penalties. It
  rejects structurally suspicious profiles before ranking and generates
  candidate-specific reasoning from profile facts. The full 100K-candidate
  ranking runs locally on CPU in roughly 20-30 seconds and produces a validator-
  passing top-100 CSV.

